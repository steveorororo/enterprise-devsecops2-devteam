name: GitOps Promote

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      repository:
        description: GitOps repository as owner/name, from config/pipeline.yaml
        required: true
        type: string
      path:
        description: Directory within the GitOps repository that Argo CD watches for dev
        required: true
        type: string
      configured:
        description: Whether gitops.repository and gitops.path are set to real values
        required: true
        type: string

    secrets:
      GITOPS_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  open-gitops-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require a configured GitOps target
        if: inputs.configured != 'true'
        run: |
          echo "::error::gitops.repository and gitops.path in config/pipeline.yaml are still placeholders." >&2
          echo "The image was built, scanned, and pushed, but there is no desired state to update." >&2
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # render-deployment.py renders the scanned source overlay with the promoted digest,
      # so kustomize has to be present. Verified against the release checksum before it
      # runs, in keeping with every other tool this pipeline installs.
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: 5.4.3
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Checkout GitOps repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.GITOPS_BOT_TOKEN }}
          path: gitops-checkout
          persist-credentials: false

      - name: Render scanned dev desired state
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci.txt
          python3 scripts/utility/render-deployment.py \
            --environment dev \
            --digest "${DIGEST}" \
            --gitops-checkout gitops-checkout \
            --gitops-path "${GITOPS_PATH}"
        env:
          GITOPS_PATH: ${{ inputs.path }}
          DIGEST: ${{ inputs.digest }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITOPS_BOT_TOKEN }}
          path: gitops-checkout
          branch: "promote/${{ github.sha }}"
          commit-message: "chore(gitops): promote ${{ github.sha }} to dev"
          title: "Promote ${{ github.sha }} to dev"
          body: |
            Automated GitOps update opened by CI. Source commit: ${{ github.sha }}.
            Image digest: ${{ inputs.digest }}
            Merge to trigger the Argo CD sync.
          committer: "gitops-bot <gitops-bot@users.noreply.github.com>"
          author: "gitops-bot <gitops-bot@users.noreply.github.com>"
          labels: automated-promotion

# GITOPS_BOT_TOKEN is a fine-grained token scoped to the GitOps repository alone. It is not
# available to workflows triggered by pull_request from a fork; this workflow runs only via
# workflow_call from build-scan-publish.yml, which itself runs only on push to main.
