name: Scheduled Scans

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  trivy-full:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci.txt
          python3 scripts/utility/read-pipeline-config.py >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.app_configured == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ steps.config.outputs.app_path }}
          format: sarif
          output: trivy-full.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - if: steps.config.outputs.app_configured == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-full.sarif
          category: trivy-scheduled

  zap-full:
    # Full scans send active attack traffic. The target is a trusted repository variable,
    # never a workflow-dispatch input, so a caller cannot redirect the scanner.
    if: vars.ZAP_TEST_URL != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd295053ed # v0.12.0
        with:
          target: ${{ vars.ZAP_TEST_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          fail_action: false
          issue_title: "ZAP weekly full scan"
