name: Build, Scan, Publish

on:
  push:
    branches: [main]

permissions: {}

# Builds are not cancelled mid-flight. A cancelled run can leave an image pushed with no
# corresponding GitOps pull request, which is harder to reason about than a queued build.
concurrency:
  group: build-scan-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.registry.outputs.image_ref }}
      registry_host: ${{ steps.registry.outputs.host }}
      registry_username: ${{ steps.registry.outputs.username }}
      signing_enabled: ${{ steps.registry.outputs.signing_enabled }}
      sonar_enabled: ${{ steps.registry.outputs.sonar_enabled }}
      gitops_repository: ${{ steps.registry.outputs.gitops_repository }}
      gitops_path: ${{ steps.registry.outputs.gitops_path }}
      gitops_configured: ${{ steps.registry.outputs.gitops_configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve configuration
        id: registry
        run: |
          python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci.txt
          python3 scripts/utility/resolve-registry.py >> "$GITHUB_OUTPUT"
          python3 scripts/utility/read-pipeline-config.py >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          buildah bud \
            --file build/Dockerfile \
            --tag "${IMAGE_REF}:${GITHUB_SHA}" \
            "${APP_PATH}"
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          APP_PATH: ${{ steps.registry.outputs.app_path }}

      - name: Push image
        id: push
        run: |
          buildah login --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_HOST" <<< "$REGISTRY_TOKEN"
          # --digestfile records the digest the registry returned. The locally stored
          # manifest digest is not guaranteed to match it after push, so everything
          # downstream reads this file rather than local storage.
          buildah push --digestfile /tmp/image.digest \
            "${IMAGE_REF}:${GITHUB_SHA}" \
            "docker://${IMAGE_REF}:${GITHUB_SHA}"
          digest="$(cat /tmp/image.digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_REF}@${digest}"
        env:
          IMAGE_REF: ${{ steps.registry.outputs.image_ref }}
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scans the image by digest from the registry, so the gate blocks on the exact
          # artifact that was pushed rather than on whatever is in local storage.
          scan-type: image
          image-ref: ${{ steps.registry.outputs.image_ref }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ steps.registry.outputs.username }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Generated for every build. Signing is a separate job so the build and scanner steps
      # never receive id-token: write when signing is disabled.
      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ steps.registry.outputs.image_ref }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          registry-username: ${{ steps.registry.outputs.username }}
          registry-password: ${{ secrets.REGISTRY_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Publish SBOM
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          # Digest values contain a colon, which is not valid in an artifact name.
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

  # SonarQube Cloud requires a repository secret. It runs only after code has reached main,
  # never in the pull_request workflow, so a contributor cannot modify scanner configuration
  # in an unmerged branch and receive SONAR_TOKEN in the same run. CodeQL remains the primary
  # pre-merge SAST control.
  sonar:
    needs: build
    if: needs.build.outputs.sonar_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dproject.settings=security/sast/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sign:
    needs: build
    if: needs.build.outputs.signing_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # buildah authenticates in the build job only. Signing is isolated here so the OIDC
      # permission is present only when signing is enabled, and this job performs its own
      # explicit registry login before writing the attestation or signature.
      - name: Authenticate cosign to the registry
        run: |
          set -euo pipefail
          cosign login --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_HOST" <<< "$REGISTRY_TOKEN"
        env:
          REGISTRY_HOST: ${{ needs.build.outputs.registry_host }}
          REGISTRY_USERNAME: ${{ needs.build.outputs.registry_username }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Attest SBOM
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE_REF}@${DIGEST}"
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DIGEST: ${{ needs.build.outputs.digest }}

      - name: Sign image
        run: |
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DIGEST: ${{ needs.build.outputs.digest }}

  gitops-promote:
    needs: [build, sign, sonar]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
          (needs.sign.result == 'success' || needs.sign.result == 'skipped') &&
          (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}
    # The called workflow's job requests contents: read. A called workflow cannot hold more
    # than its caller, and the workflow-level default here is no permissions at all, so the
    # call is declared explicitly rather than by widening the default.
    permissions:
      contents: read
    uses: ./.github/workflows/gitops-promote.yml
    with:
      digest: ${{ needs.build.outputs.digest }}
      repository: ${{ needs.build.outputs.gitops_repository }}
      path: ${{ needs.build.outputs.gitops_path }}
      configured: ${{ needs.build.outputs.gitops_configured }}
    secrets:
      GITOPS_BOT_TOKEN: ${{ secrets.GITOPS_BOT_TOKEN }}
