name: PR Validate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Security controls are executed by the central AppSec platform at an immutable commit. The
# job ids below are the security gate contract in config/security-gate.yaml and do not change
# when an implementation moves.

jobs:
  # config/pipeline.yaml is the single place a team declares its application and selects
  # which optional controls run. Every job below reads from here.
  config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      app_path: ${{ steps.read.outputs.app_path }}
      app_configured: ${{ steps.read.outputs.app_configured }}
      build_configured: ${{ steps.read.outputs.build_configured }}
      build_install: ${{ steps.read.outputs.build_install }}
      build_lint: ${{ steps.read.outputs.build_lint }}
      build_test: ${{ steps.read.outputs.build_test }}
      build_compile: ${{ steps.read.outputs.build_compile }}
      codeql_matrix: ${{ steps.read.outputs.codeql_matrix }}
      trivy_fs_enabled: ${{ steps.read.outputs.trivy_fs_enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: read
        run: |
          python3 -m pip install --quiet --require-hashes -r scripts/requirements-ci.txt
          python3 scripts/utility/read-pipeline-config.py >> "$GITHUB_OUTPUT"
          python3 scripts/security/validate-suppressions.py

  # Runs the application's own build commands. Skips until config/pipeline.yaml declares
  # them, which is why this job is listed under skippable_jobs.
  unit-tests:
    needs: config
    if: needs.config.outputs.build_configured == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ needs.config.outputs.app_path }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Each command is passed through the environment rather than expanded into the shell
      # by the expression evaluator, so its content is data to the runner rather than
      # workflow syntax.
      #
      # Avoid package-manager lifecycle or build hooks where the ecosystem provides a safe
      # mode. This job is intentionally secretless and limited to contents: read because
      # application tests and some dependency installation paths execute untrusted code by
      # design. A scanner result is not a sandbox boundary.
      - if: needs.config.outputs.build_install != ''
        run: sh -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ needs.config.outputs.build_install }}
      - if: needs.config.outputs.build_lint != ''
        run: sh -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ needs.config.outputs.build_lint }}
      - if: needs.config.outputs.build_test != ''
        run: sh -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ needs.config.outputs.build_test }}
      - if: needs.config.outputs.build_compile != ''
        run: sh -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ needs.config.outputs.build_compile }}

  secrets-scan:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/secret-scanning.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  sca-trivy-fs:
    needs: config
    if: needs.config.outputs.trivy_fs_enabled == 'true' && needs.config.outputs.app_configured == 'true'
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/dependency-security.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
      security-events: write
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0
      scan_path: ${{ needs.config.outputs.app_path }}

  # Compares the dependency manifests either side of the pull request and fails on a newly
  # introduced vulnerable or disallowed dependency. Complements the Trivy scan: this one
  # sees what the change adds, rather than the state of the tree afterwards.
  #
  # Requires Dependency graph to be enabled under Settings, Code security. The job fails
  # rather than skips if it is off, because a silently absent check is worse than a loud one.
  dependency-review:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/dependency-review.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  iac-checkov:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/iac-security.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
      security-events: write
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  manifest-lint:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/manifest-security.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  codeql:
    needs: config
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/code-scanning.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
      security-events: write
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0
      language_matrix: ${{ needs.config.outputs.codeql_matrix }}

  # The single check branch protection requires. Adding a job to this workflow means adding
  # it to needs below and to required_jobs in config/security-gate.yaml, or the gate cannot
  # see its result.
  gate:
    needs: [config, unit-tests, secrets-scan, sca-trivy-fs, dependency-review, iac-checkov,
            manifest-lint, codeql]
    if: always()
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/security-gate.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0
      needs: ${{ toJSON(needs) }}
