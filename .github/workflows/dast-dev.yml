name: DAST (Dev)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: GitOps revision that was synced, for the report title
        required: true
        type: string

permissions: {}

jobs:
  zap-baseline:
    if: vars.ZAP_DEV_URL != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          # The target is a repository variable set by a maintainer, not workflow input.
          # A dispatch caller can choose the revision label but cannot redirect the scanner.
          target: ${{ vars.ZAP_DEV_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          rules_file_name: security/dast/zap-baseline.conf
          fail_action: true
          issue_title: "ZAP dev scan: ${{ inputs.revision }}"

# Intended caller: an Argo CD PostSync hook or notification after the dev Application is
# Healthy. The dispatch token needs only actions:write on this repository. Set ZAP_DEV_URL
# to the approved dev route before wiring the trigger. The workflow does not accept a target
# URL from the caller.
