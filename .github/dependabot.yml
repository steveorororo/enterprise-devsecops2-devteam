  #     - dependencies

  # Terraform
  # - package-ecosystem: terraform
  #   directory: /<your-app-directory>
  #   schedule:
  #     interval: weekly
  #   labels:
  #     - dependencies

  # Bundler
  # - package-ecosystem: bundler
  #   directory: /<your-app-directory>
  #   schedule:
  #     interval: weekly
  #   labels:
  #     - dependencies

  # Cargo
  # - package-ecosystem: cargo
  #   directory: /<your-app-directory>
  #   schedule:
  #     interval: weekly
  #   labels:
  #     - dependencies

  # Active by default: the pipeline's Python dependency, the container base image,
  # and the pipeline's own actions.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
