# This file has no effect unless Sonar is explicitly enabled in config/pipeline.yaml.
# Adoption edits: set the project key and organisation from your SonarQube Cloud project, and
# point the paths below at your application. sources and tests must not overlap; Sonar
# rejects a file that appears in both.
sonar.projectKey=<set-me>
sonar.organization=<set-me>
sonar.host.url=https://sonarcloud.io

sonar.sources=<your-app-directory>/src
sonar.tests=<your-app-directory>/src
sonar.exclusions=<your-test-file-pattern>
sonar.test.inclusions=<your-test-file-pattern>

# Coverage report path, in the format your test runner produces.
# sonar.<language>.coverage.reportPaths=<your-app-directory>/<coverage-report>
